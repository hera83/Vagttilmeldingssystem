# Vagttilmelding i Docker.
# 1. Kopiér .env.example til .env, og udfyld værdierne.
# 2. docker compose up -d --build
# Containeren kører kun http på 8080. https og WebSockets (live-opdatering) på domænet håndteres af en reverse proxy foran.
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    # Åben på alle netkort (step 20): systemet kan bruges direkte på http://<server>:8080, og en reverse proxy
    # (på serveren eller en anden maskine) sender https-trafikken på domænet hertil.
    # Systemet stoler på X-Forwarded-* fra private netværk, så begræns porten med firewallen, hvis det er nødvendigt.
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - web_app_dbs:/app/app_dbs
      - web_app_files:/app/app_files
    restart: unless-stopped

volumes:
  web_app_dbs:
  web_app_files:
