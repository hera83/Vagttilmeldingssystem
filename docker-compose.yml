# Vagttilmelding i Docker (forberedt i step 16, endnu ikke kørt).
# 1. Kopiér .env.example til .env, og udfyld værdierne.
# 2. docker compose up -d --build
# Containeren kører kun http på 8080. https og WebSockets (live-opdatering) håndteres af en reverse proxy foran.
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    # Kun fra selve serveren (fx nginx på værten). Caddy i samme compose-fil bruger web:8080 og behøver ikke porten.
    # Kører proxyen på en anden maskine, så skift til "8080:8080", og sørg for, at kun proxyen kan nå porten:
    # systemet stoler på X-Forwarded-* fra private netværk.
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - web_app_dbs:/app/app_dbs
      - web_app_files:/app/app_files
    restart: unless-stopped

volumes:
  web_app_dbs:
  web_app_files:
